name: CI

# Nothing ran typecheck or tests on push before this, so anything that compiled
# on the author's machine reached production unchecked. Both of the P0s that
# made it to main would have been caught here.
#
# Deliberately just typecheck + tests: fast enough to actually be waited for.
# It is not a build, so it will not catch build-only failures (a dependency in
# devDependencies that Render needs at build time, for instance).

on:
  push:
    branches: [main]
  pull_request:

# A newer push makes an in-flight run pointless. Cancel it rather than queue.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server:
    name: server — typecheck + tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          # Must match "packageManager" in server/package.json and
          # user/package.json. There is no workspace root for the action to
          # read it from, so it is stated here and has to be kept in step.
          version: 10.18.1

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: server/pnpm-lock.yaml

      # --frozen-lockfile: fail rather than silently resolve a different tree.
      # The lockfiles had drifted badly (pnpm-lock said fastify 4, the manifest
      # wanted 5, node_modules had 5.12) and nothing caught it, because a plain
      # install just fixes the lockfile up and carries on. This makes CI the
      # thing that notices. Every project is single-lockfile (pnpm) as of
      # 2026-08-29 — admin's stale package-lock.json is gone.
      - run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm exec tsc --noEmit

      # No database service needed: every suite mocks the pool
      # (tests/mocks/database.mock.ts), and tests/setup.ts overrides
      # DATABASE_URL before anything can connect. The three suites needing real
      # infrastructure (redis, integration, schema) are skipped in the source.
      - name: Tests
        run: pnpm test

  web:
    name: web — typecheck + tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: user
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.18.1

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: user/pnpm-lock.yaml

      # --frozen-lockfile: fail rather than silently resolve a different tree.
      # The lockfiles had drifted badly (pnpm-lock said fastify 4, the manifest
      # wanted 5, node_modules had 5.12) and nothing caught it, because a plain
      # install just fixes the lockfile up and carries on. This makes CI the
      # thing that notices. Every project is single-lockfile (pnpm) as of
      # 2026-08-29 — admin's stale package-lock.json is gone.
      - run: pnpm install --frozen-lockfile

      # No .next/ on a fresh checkout, so the generated route types this
      # tsconfig includes simply do not match — which is cleaner than running
      # locally, where a half-written .next/dev/types file can report phantom
      # syntax errors in code nobody wrote.
      - name: Typecheck
        run: pnpm exec tsc --noEmit

      # Component tests (vitest + Testing Library). They render components
      # directly — no dev server, no database, no network — so they are quick
      # enough to sit in front of every push. They exist because the dialogs
      # guarding every destructive action had behaviour that could only be
      # checked by clicking, and one of them was silently broken for it.
      - name: Tests
        run: pnpm test

  admin:
    name: admin — typecheck
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: admin
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.18.1

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: admin/pnpm-lock.yaml

      # --frozen-lockfile: fail rather than silently resolve a different tree.
      - run: pnpm install --frozen-lockfile

      # Admin was in neither job until now, and it was the last project still
      # carrying two lockfiles — a package-lock.json from June beside a
      # pnpm-lock.yaml from August, with nothing checking either. The install
      # above is the part that blocks, because lockfile drift is what actually
      # went wrong here and it is now guarded.
      #
      # Blocking. It briefly was not: admin had 16 pre-existing type errors
      # (Column<T> render signatures, four isolatedModules type-only imports,
      # and shadcn's chart.tsx against recharts 3, which moved `payload` and
      # `label` off Tooltip's public props). Those are fixed, so this job is
      # green on arrival and can be trusted to stay that way.
      - name: Typecheck
        run: pnpm exec tsc --noEmit
